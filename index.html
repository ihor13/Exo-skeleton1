  :root{

  #canvas-wrap{position:absolute;inset:0}

    text-transform:uppercase;padding:3px 7px;border-radius:5px;border:1px solid var(--line);

  .empty{color:var(--dim);font-size:13px;line-height:1.6;padding:28px 2px}
  .backbtn{
    background:none;border:none;color:var(--accent);font-family:var(--mono);font-size:10.5px;
    letter-spacing:.1em;cursor:pointer;padding:0;margin-bottom:12px;text-transform:uppercase;
  }
  code{font-family:var(--mono);font-size:11.5px;background:#10161e;padding:1px 5px;border-radius:4px;color:var(--accent-2)}

  @media (max-width:900px){
    body{flex-direction:column}
    #side{width:100%;flex:0 0 46%;border-left:none;border-top:1px solid var(--line)}
    #stage{flex:1 1 54%}
  }
</style>
</head>

    group:'Power & Light', color:'#b4661a', qty:'×1',

    how:'A 4S2P pack of 21700 cells sits in the lumbar plate, right over your centre of mass, so the weight loads your hips instead of hanging off your shoulders. The pack feeds two rails: a raw 14.8–16.8 V rail for the high-torque joints, and a 6 V buck rail for the small servos, because feeding a hobby servo 16 V will cook it in seconds.',
    specs:[['Cells','8 × 21700 Li-ion, 4S2P'],['Nominal','14.8 V, 9.6 Ah, 142 Wh'],['BMS','4S 60 A, balance + over-discharge cutoff'],['Rails','16.8 V raw · 6.0 V / 20 A buck · 5 V / 3 A logic'],['Protection','40 A ANL fuse at pack positive'],['Runtime','~75 min mixed posing, ~4 h lamp only'],['Mass','1.42 kg incl. case']],
    notes:['Under 160 Wh you can carry it on a plane in the cabin. This pack is sized to stay under that line on purpose.','Fuse at the pack, not at the load. A short in the harness with no pack-side fuse is a fire inside a suit you are wearing.','Keep the main switch and the charge port reachable from outside the armour while you are wearing it. You will not be able to take the back plate off alone.'],
    pills:['142 Wh','4S2P','Hot-swap']
  },
  'bus': {
    group:'Power & Light', color:'#b4661a', qty:'—',
    kicker:'Harness', name:'Power & Signal Harness',
    sub:'Star-topology power, daisy-chained data',
    how:'Power runs as a star — every limb gets its own pair back to a bus bar at the pack, so a stalled knee cannot brown out the shoulders. Data is the opposite: one differential daisy chain through all smart actuators, each with its own ID. Every joint gets a service loop and a connector, so a limb unplugs as a unit.',
    specs:[['Power trunk','12 AWG silicone to bus bar'],['Limb drops','16 AWG silicone, XT30 per limb'],['Data','TTL half-duplex, JST-XH chain'],['Connectors','XT30 power · JST data · keyed'],['Strain relief','Clamp both sides of every joint crossing']],

    pills:['Star power','Daisy data','Per-limb drops']

  'controller': {
    group:'Power & Light', color:'#b4661a', qty:'×1',
    kicker:'Dorsal Bay', name:'Control Board & IMU',
    sub:'32-bit MCU, pose sequencer, inline current sensing',
    how:'An ESP32-class board sequences poses rather than running live inverse kinematics — in a costume you want a handful of rehearsed, timed motions you can trigger, not a robot solving for itself. Each pose is an array of joint angles with a duration, interpolated with an ease curve so the frame moves like a machine under load instead of snapping. An IMU in the chest kills all motion if the wearer tilts past 25°.',

/* beveled plate — rounded rect extruded with a bevel, giving armour-like
   soft edges instead of hard boxes */
function rrShape(w,h,r){
  const s = new THREE.Shape();
  const x = -w/2, y = -h/2;
  s.moveTo(x+r, y);
  s.lineTo(x+w-r, y);       s.quadraticCurveTo(x+w, y, x+w, y+r);
  s.lineTo(x+w, y+h-r);     s.quadraticCurveTo(x+w, y+h, x+w-r, y+h);
  s.lineTo(x+r, y+h);       s.quadraticCurveTo(x, y+h, x, y+h-r);
  s.lineTo(x, y+r);         s.quadraticCurveTo(x, y, x+r, y);
  return s;
}
function plateGeo(w,h,d,r,bev){
  bev = bev === undefined ? Math.min(0.012, d*0.33) : bev;
  r = Math.min(r, Math.min(w,h)/2 - 0.001);
  const g = new THREE.ExtrudeGeometry(rrShape(w,h,r), {
    depth: Math.max(d - bev*2, 0.002), bevelEnabled:true,
    bevelThickness:bev, bevelSize:bev, bevelSegments:2, curveSegments:6, steps:1
  });
  g.center();
  return g;
}
const plate = (w,h,d,r,mat,bev)=>new THREE.Mesh(plateGeo(w,h,d,r,bev), mat);
const box   = (w,h,d,mat)=>new THREE.Mesh(new THREE.BoxGeometry(w,h,d), mat);
const cyl   = (rt,rb,h,mat,s)=>new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,s||20), mat);
const sph   = (r,mat)=>new THREE.Mesh(new THREE.SphereGeometry(r,22,16), mat);
/* domed cap — half sphere, used for rondels, poleyns, helmet crown */
function dome(r, mat, squash){
  const m = new THREE.Mesh(new THREE.SphereGeometry(r,20,12,0,Math.PI*2,0,Math.PI/2), mat);
  m.scale.y = squash || 0.7;
  return m;
}
/* curved lame — a slice of a tube, the workhorse of articulated armour */
function lame(radius, thick, width, arc, mat){
  const g = new THREE.CylinderGeometry(radius, radius, width, 22, 1, true, -arc/2, arc);
  const inner = new THREE.CylinderGeometry(radius-thick, radius-thick, width, 22, 1, true, -arc/2, arc);
  const m = new THREE.Mesh(g, mat);
  const im = new THREE.Mesh(inner, mat);
  im.scale.set(1,1,1);
  const grp = new THREE.Group();
  m.rotation.x = Math.PI/2; im.rotation.x = Math.PI/2;
  grp.add(m); grp.add(im);
  /* cap the edges so it does not read as paper-thin */
  const cap = new THREE.Mesh(new THREE.RingGeometry(radius-thick, radius, 20, 1, -arc/2, arc), mat);
  const cap2 = cap.clone();
  cap.position.z = width/2; cap2.position.z = -width/2; cap2.rotation.y = Math.PI;
  grp.add(cap); grp.add(cap2);
  return grp;
}

function part(obj, id, explodeDir){
  obj.traverse(o=>{ if(o.isMesh){ o.userData.partId = id; clickable.push(o); } });
  if (obj.isMesh){ obj.userData.partId = id; }
  if (explodeDir) obj.userData.explode = explodeDir;
  obj.userData.partId = id;
  return obj;
}
/* meshes inside a Group need registering individually */
function reg(obj, id){
  obj.traverse(o=>{ if(o.isMesh && !o.userData.partId){ o.userData.partId = id; clickable.push(o); } });
  return obj;
}

/* ---------------------------- INTERACTION ----------------------------- */
const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();
let hovered = null, selected = null;
const tip = document.getElementById('tip');

function applyTint(id, color, intensity){
  clickable.forEach(m=>{
    if (m.userData.partId !== id) return;
    if (!m.userData._mat){ m.userData._origMat = m.material; m.userData._mat = m.material.clone(); }
    m.material = m.userData._mat;
    if (m.material.emissive){ m.material.emissive.set(color); m.material.emissiveIntensity = intensity; }
  });
}
function clearTint(id){
  clickable.forEach(m=>{ if (m.userData.partId === id && m.userData._origMat) m.material = m.userData._origMat; });
}
function refreshTints(){
  new Set(clickable.map(m=>m.userData.partId)).forEach(id=>{
    if (id === selected) applyTint(id, 0x12b3a6, 0.75);
    else if (id === hovered) applyTint(id, 0x12b3a6, 0.30);
    else clearTint(id);
  });
}
function pick(ev){
  const r = renderer.domElement.getBoundingClientRect();
  pointer.x = ((ev.clientX - r.left)/r.width)*2 - 1;
  pointer.y = -((ev.clientY - r.top)/r.height)*2 + 1;
  raycaster.setFromCamera(pointer, camera);
  const hit = raycaster.intersectObjects(clickable, false);
  return hit.length ? hit[0].object.userData.partId : null;
}
renderer.domElement.addEventListener('pointermove', ev=>{
  if (drag.active){ tip.style.opacity = 0; return; }
  const id = pick(ev);
  if (id !== hovered){ hovered = id; refreshTints(); renderer.domElement.style.cursor = id ? 'pointer' : 'grab'; }
  if (id && DB[id]){
    tip.textContent = DB[id].name;
    tip.style.left = (ev.clientX + 14)+'px'; tip.style.top = (ev.clientY - 10)+'px';
    tip.style.opacity = 1;
  } else tip.style.opacity = 0;
});
renderer.domElement.addEventListener('pointerleave', ()=>{ tip.style.opacity=0; hovered=null; refreshTints(); });
renderer.domElement.addEventListener('click', ev=>{
  if (drag.moved) return;
  const id = pick(ev);
  if (id && DB[id]) selectPart(id);
});

/* ------------------------- CAMERA / ORBIT ----------------------------- */
const cam = {theta:0.55, phi:1.26, dist:4.3, target:new THREE.Vector3(0,1.02,0)};
const HOME = {theta:0.55, phi:1.26, dist:4.3, ty:1.02};
function updateCamera(){
  const r = cam.dist, sp = Math.sin(cam.phi);
  camera.position.set(
    cam.target.x + r*sp*Math.sin(cam.theta),
    cam.target.y + r*Math.cos(cam.phi),
    cam.target.z + r*sp*Math.cos(cam.theta));
  camera.lookAt(cam.target);
}
const drag = {active:false, moved:false, x:0, y:0, btn:0};
renderer.domElement.addEventListener('pointerdown', e=>{
  drag.active=true; drag.moved=false; drag.x=e.clientX; drag.y=e.clientY; drag.btn=e.button;
  renderer.domElement.setPointerCapture(e.pointerId);
});
renderer.domElement.addEventListener('pointerup', e=>{
  drag.active=false;
  try{ renderer.domElement.releasePointerCapture(e.pointerId); }catch(_){}
  setTimeout(()=>{ drag.moved=false; },0);
});
renderer.domElement.addEventListener('pointermove', e=>{
  if (!drag.active) return;
  const dx=e.clientX-drag.x, dy=e.clientY-drag.y;
  if (Math.abs(dx)+Math.abs(dy) > 4){ drag.moved=true; state.spin=false; syncButtons(); }
  drag.x=e.clientX; drag.y=e.clientY;
  if (drag.btn===2 || e.shiftKey){
    cam.target.y = Math.max(0.2, Math.min(2.0, cam.target.y + dy*0.004));
  } else {
    cam.theta -= dx*0.006;
    cam.phi = Math.max(0.25, Math.min(Math.PI-0.15, cam.phi + dy*0.005));
  }
  updateCamera();
});
renderer.domElement.addEventListener('wheel', e=>{
  e.preventDefault();
  cam.dist = Math.max(1.2, Math.min(11, cam.dist + e.deltaY*0.0022));
  updateCamera();
}, {passive:false});
renderer.domElement.addEventListener('contextmenu', e=>e.preventDefault());

/* ---------------------------- TOGGLE STATE ---------------------------- */
const state = {explode:false, lamp:true, wiring:false, xray:false, spin:false};
let explodeAmt = 0;
function syncButtons(){
  document.querySelectorAll('.tbtn').forEach(b=>{
    const a=b.dataset.act; if (a in state) b.classList.toggle('on', !!state[a]);
  });
}
document.querySelectorAll('.tbtn').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    const a = btn.dataset.act;
    if (a==='reset'){
      cam.theta=HOME.theta; cam.phi=HOME.phi; cam.dist=HOME.dist; cam.target.set(0,HOME.ty,0);
      updateCamera(); return;
    }
    state[a] = !state[a];
    if (a==='lamp') setLamp(state.lamp);
    if (a==='wiring') harness.visible = state.wiring;
    if (a==='xray') setXray(state.xray);
    syncButtons();
  });
});
function setLamp(on){
  beam.intensity = on ? 1.5 : 0;
  bounce.intensity = on ? 0.5 : 0;
  cone.visible = on;
  M.glow.emissiveIntensity = on ? 1.5 : 0.04;
}
function setXray(on){
  const apply = m=>{
    m.transparent = on; m.opacity = on ? 0.20 : 1;
    m.depthWrite = !on; m.needsUpdate = true;
  };
  [M.shell, M.shellDk, M.trim, M.leather].forEach(apply);
  clickable.forEach(mesh=>{
    const o = mesh.userData._origMat;
    if (mesh.userData._mat && (o===M.shell||o===M.shellDk||o===M.trim||o===M.leather)) apply(mesh.userData._mat);
  });
}

/* ------------------------------ SIDEBAR ------------------------------- */
const bodyEl = document.getElementById('body');
let tab = 'parts';
document.querySelectorAll('.tab').forEach(t=>{
  t.addEventListener('click', ()=>{
    tab = t.dataset.tab;
    document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on', x===t));
    render();
  });
});
function selectPart(id){
  selected = id; refreshTints(); tab='detail';
  document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on', x.dataset.tab==='detail'));
  render();
}
function renderParts(){
  let html='';
  GROUP_ORDER.forEach(gr=>{
    html += `<div class="group-label">${gr}</div><div class="plist">`;
    Object.keys(DB).filter(k=>DB[k].group===gr).forEach(k=>{
      const p=DB[k];
      html += `<div class="pitem${selected===k?' on':''}" data-part="${k}">
        <span class="dot" style="background:${p.color}"></span>
        <span>${p.name}</span><span class="qty">${p.qty}</span></div>`;
    });
    html += '</div>';
  });
  return html;
}
function renderDetail(){
  if (!selected) return `<div class="empty">Nothing selected yet.<br><br>Click a part in the 3D view, or pick one from the Parts list, to see its actuation, specs and build notes.</div>`;
  const p = DB[selected];
  return `<button class="backbtn" data-back>&larr; All parts</button>
    <div class="d-head">
      <div class="d-kicker">${p.kicker} · ${p.qty}</div>
      <h2>${p.name}</h2><div class="sub">${p.sub}</div>
      ${p.pills.map(x=>`<span class="pill">${x}</span>`).join('')}
    </div>
    <div class="sec"><h3>How it works</h3><p>${p.how}</p></div>
    <div class="sec"><h3>Specifications</h3><table class="specs">
      ${p.specs.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td></tr>`).join('')}</table></div>
    <div class="sec"><h3>Build notes</h3><ul class="notes">
      ${p.notes.map(n=>`<li>${n}</li>`).join('')}</ul></div>`;
}
function renderPower(){
  return `<div class="sec"><h3>Budget</h3><table class="specs">
      <tr><td>Pack energy</td><td>142 Wh (14.8 V · 9.6 Ah)</td></tr>
      <tr><td>Idle draw (all joints)</td><td>~2.1 A · 31 W</td></tr>
      <tr><td>Lamp at full</td><td>0.57 A · 8.4 W</td></tr>
      <tr><td>Logic + control</td><td>0.4 A · 6 W</td></tr>
      <tr><td>Worst-case peak</td><td>38 A · 560 W (all joints moving)</td></tr>
      <tr><td>Realistic posing</td><td>~113 W avg → ~75 min</td></tr>
      <tr><td>Lamp only</td><td>~4 h</td></tr></table></div>
    <div class="sec"><h3>Rails</h3><p>Three rails off one pack. The raw <code>16.8 V</code> rail feeds the shoulders, hips and knees. A <code>6 V / 20 A</code> buck feeds every smart servo — wrists, ankles, neck. A small <code>5 V / 3 A</code> rail runs logic, fans and the lamp driver. Never share a ground return between the motor rail and the logic rail; star-ground both at the pack.</p></div>
    <div class="sec"><h3>Mass</h3><table class="specs">
      <tr><td>Structure &amp; shell</td><td>8.6 kg</td></tr>
      <tr><td>Actuators</td><td>6.4 kg</td></tr>
      <tr><td>Battery &amp; electronics</td><td>1.8 kg</td></tr>
      <tr><td>Total worn</td><td>~16.8 kg</td></tr></table>
      <p style="margin-top:9px">Roughly 60% of that lands on the hips through the ground plates, not the shoulders — which is the whole reason the pack sits at the lumbar and the ankle motors sit in the shin.</p></div>
    <div class="sec"><h3>Articulation count</h3><table class="specs">
      <tr><td>Powered axes</td><td>14</td></tr>
      <tr><td>Articulated lames</td><td>31 (gorget, ab, pauldron, toe)</td></tr>
      <tr><td>Strap-hung plates</td><td>4 tassets</td></tr>
      <tr><td>Finger segments</td><td>20</td></tr></table></div>
    <div class="sec"><h3>Safety interlocks</h3><ul class="notes">
      <li>Hard-wired e-stop cutting the pack rail, reachable with either hand.</li>
      <li>Visor opens mechanically with zero power. Always.</li>
      <li>Helmet fans interlocked to run whenever the visor is down.</li>
      <li>IMU tilt cutoff past 25° kills all joint motion.</li>
      <li>40 A fuse at pack positive, before anything else.</li>
      <li>No joint moves without a spotter the first ten times it runs.</li></ul></div>`;
}
function render(){
  if (tab==='parts') bodyEl.innerHTML = renderParts();
  else if (tab==='detail') bodyEl.innerHTML = renderDetail();
  else bodyEl.innerHTML = renderPower();
  bodyEl.scrollTop = 0;
  bodyEl.querySelectorAll('[data-part]').forEach(el=>{
    el.addEventListener('click', ()=> selectPart(el.dataset.part));
    el.addEventListener('mouseenter', ()=>{ hovered = el.dataset.part; refreshTints(); });
    el.addEventListener('mouseleave', ()=>{ hovered = null; refreshTints(); });
  });
  const back = bodyEl.querySelector('[data-back]');
  if (back) back.addEventListener('click', ()=>{
    tab='parts';
    document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on', x.dataset.tab==='parts'));
    render();
  });
}

/* ------------------------------- LOOP --------------------------------- */
function resize(){
  const w=wrap.clientWidth, h=wrap.clientHeight;
  camera.aspect = w/h; camera.updateProjectionMatrix(); renderer.setSize(w,h);
}
window.addEventListener('resize', resize);

/* collect explodable objects (groups and meshes carrying a direction) */
const explodables = [];
frame.traverse(o=>{ if (o.userData && o.userData.explode) explodables.push(o); });

let t=0;
function animate(){
  requestAnimationFrame(animate);
  t += 0.016;
  const target = state.explode ? 1 : 0;
  explodeAmt += (target - explodeAmt)*0.09;
  limbGroups.forEach(l=>{ l.g.position.copy(l.dir).multiplyScalar(explodeAmt*0.30); });
  explodables.forEach(o=>{
    if (!o.userData._home) o.userData._home = o.position.clone();
    o.position.copy(o.userData._home).addScaledVector(o.userData.explode, explodeAmt*0.17);
  });
  if (state.lamp){
    M.glow.emissiveIntensity = 1.5 + Math.sin(t*2.3)*0.05;
    beam.intensity = 1.45 + Math.sin(t*2.3)*0.06;
    cone.material.opacity = 0.065 + Math.sin(t*1.7)*0.006;
  }
  if (state.spin){ cam.theta += 0.0035; updateCamera(); }
  renderer.render(scene, camera);
}

resize(); updateCamera(); setLamp(true); syncButtons(); render(); animate();
<\/script>
</body>
</html>
</script>

<script>
/* ==========================================================================
   EXO SKELETON 1 — entry/exit sequence viewer
   Original design. Single file, no assets.
   ========================================================================== */

/* ------------------------------ PHASES ---------------------------------- */
const PHASES = [
  { a:0.00, b:0.10, id:'latch', name:'Latch Release',
    desc:'Six rotary latches around the torso back out of their strikers. Nothing moves yet — the shell is still closed, just no longer locked. Status ring goes amber the moment the last latch reports open, and it will not go green again until every one re-seats.',
    act:[['Latch pins ×6','4 mm retract','0.8 A'],['Status ring','amber','0.2 A']] },
  { a:0.10, b:0.30, id:'spine', name:'Dorsal Split',
    desc:'The back plate is the structural keystone, so it moves first and alone. A gas strut assists a short ball-screw ram that walks the plate 220 mm aft and 50 mm up along two hardened rails. Until it clears, nothing on the front can rotate — the geometry is interlocked on purpose.',
    act:[['Dorsal ram','220 mm','6.2 A'],['Gas strut','assist 180 N','—'],['Rail carriage','free','—']] },
  { a:0.30, b:0.54, id:'chest', name:'Chest Clamshell',
    desc:'The two front halves swing out on vertical hinges, each driven by its own four-bar linkage rather than a motor at the hinge pin. The linkage does the hard part: it holds the plate rigid at the closed position with no current, and the mechanical advantage is highest exactly there, where the seal needs clamping force.',
    act:[['Clamshell ram L','145 mm','4.4 A'],['Clamshell ram R','145 mm','4.4 A'],['Lamp tilt servo','38°','0.6 A']] },
  { a:0.54, b:0.72, id:'pelvis', name:'Pelvic Drop',
    desc:'The pelvic apron rotates forward and down, and the thigh shells hinge outboard. This is the step that actually makes the frame enterable — before it, the hip opening is far too small to step through. The waist slip ring stays powered throughout so the torso never loses its data chain.',
    act:[['Apron actuator','52°','3.1 A'],['Thigh hinge L','44°','2.2 A'],['Thigh hinge R','44°','2.2 A']] },
  { a:0.72, b:0.88, id:'limbs', name:'Limb Shells',
    desc:'Forearm clamshells hinge open and the pauldrons lift clear of the shoulder actuators. These are the lightest moves in the cycle and the only ones that can run in parallel with anything else — they are sequenced last simply because they are not load-bearing.',
    act:[['Forearm lid L','96°','1.1 A'],['Forearm lid R','96°','1.1 A'],['Pauldron lift ×2','60 mm','1.4 A']] },
  { a:0.88, b:1.00, id:'open', name:'Entry Hold',
    desc:'Full open, and the frame holds here on mechanical detents rather than motor current — you do not want 38 A of hold current running while someone climbs into the thing. The entry volume is clear at this point: 540 mm wide at the shoulders, 420 mm at the hips.',
    act:[['Detent locks','engaged','0 A'],['Hold current','none','0.4 A logic']] }
];

/* ------------------------- FRONT PLATE LAYERS --------------------------- */
const LAYERS = [
  { nm:'Paint & clear coat', sub:'2K urethane over filler primer', th:'0.3 mm', col:'#6d8a93',
    note:'Colour goes on after the panel is fitted and the split line is final. Mask the parting edge and shoot it last, so the edge gets a clean break rather than a thick ragged build-up that chips the first time the shell closes on it.' },

const REG = [];                    // every mesh, for layer/opacity handling
function mk(geo, proto, layer){
  const m = new THREE.Mesh(geo, proto.clone());
  m.userData.layer = layer;
  m.userData.baseOpacity = 1;
  REG.push(m);
  return m;
}
const BOX = (w,h,d)=>new THREE.BoxGeometry(w,h,d);
const CYL = (rt,rb,h,s)=>new THREE.CylinderGeometry(rt,rb,h,s||18);
const SPH = (r)=>new THREE.SphereGeometry(r,20,14);
/* curved lame — the workhorse shape of articulated plate armour */
function lameMesh(r,w,arc,proto,layer){
  const g = new THREE.CylinderGeometry(r,r,w,22,1,true,-arc/2,arc);
  const m = mk(g, proto, layer);
  m.material.side = THREE.DoubleSide;
  return m;
}
function domeMesh(r,squash,proto,layer){
  const m = mk(new THREE.SphereGeometry(r,18,12,0,Math.PI*2,0,Math.PI/2), proto, layer);
  m.scale.y = squash;
  return m;
}

  d.className = 'label3d'; d.textContent = L.t;
  document.getElementById('stage').appendChild(d);
  return d;
});

/* ----------------------------- ANIMATION -------------------------------- */
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const seg=(t,a,b)=>clamp((t-a)/(b-a),0,1);
const ease=x=>x*x*(3-2*x);                       // smoothstep
const S=(t,a,b)=>ease(seg(t,a,b));

function applyPose(t){
  /* latches retract */
  const L = S(t,0.00,0.10);
  RIG.latches.forEach(g=>{ g.position.z = 0.06 - L*0.035; });

  /* dorsal plate slides aft and up on its rails */
  const D = S(t,0.10,0.30);
  RIG.dorsal.position.z = -D*0.22;
  RIG.dorsal.position.y =  D*0.05;
  RIG.dorsal.rotation.x = -D*0.14;

  /* chest clamshell */
  const C = S(t,0.30,0.54);
  RIG.chest.forEach(h=>{ h.rotation.y = h.userData.sign * C * 1.32; });
  RIG.lamp.rotation.x = -C*0.66;

  /* pelvis + thighs */
  const P = S(t,0.54,0.72);
  RIG.apron.rotation.x = P*0.91;
  RIG.thighs.forEach(g=>{ g.rotation.z = g.userData.sign * P * 0.77; });

  /* limb shells */
  const Lm = S(t,0.72,0.88);
  RIG.lids.forEach(g=>{ g.rotation.x = -Lm*1.68; });
  RIG.pauldrons.forEach(g=>{
    g.position.y = 1.50 + Lm*0.06;
    g.rotation.z = g.userData.sign * Lm * 0.42;
  });

  /* helmet clears last, with the dorsal move */
  RIG.helmet.position.y = 1.70 + D*0.17;
  RIG.helmet.position.z = -D*0.11;
  RIG.helmet.rotation.x = -D*0.32;

  /* status ring: green closed → amber the instant latches move → cyan open */
  const ringCol = t < 0.02 ? 0x1f9d55 : (t > 0.95 ? 0x12b3a6 : 0xcf8a2c);
  statusRing.material.emissive.setHex(ringCol);
  statusRing.material.color.setHex(ringCol);
  statusRing.material.emissiveIntensity = 1.6 + Math.sin(perf*4)*(t>0.02&&t<0.95?0.5:0.08);

  /* lamp dims while the shell is open — it is on the moving half */
  const lit = 1 - S(t,0.30,0.54)*0.85;
  REG.forEach(m=>{ if(m.userData.layer==='glow' && m!==statusRing) m.material.emissiveIntensity = 1.5*lit; });
  beam.intensity = 1.2*lit;

  env.visible = state.env && t > 0.80;
  if (env.visible){
    const e = S(t,0.80,1.0);
    envMat.opacity = 0.18 + e*0.4;
    envFloor.material.opacity = 0.1 + e*0.28;
  }
}

/* ------------------------------- MODES ---------------------------------- */
const MODE_CAM = {
  shell: {theta:0.52, phi:1.26, dist:4.2, ty:1.02},
  mech:  {theta:0.95, phi:1.18, dist:3.3, ty:1.20},
  front: {theta:0.12, phi:1.40, dist:1.5, ty:1.34}
};
let mode = 'shell';
let peel = 0;

function applyMode(){
  REG.forEach(m=>{
    const l = m.userData.layer;
    let op = m.userData.baseOpacity, vis = true;
    if (mode === 'shell'){
      if (l === 'mech') vis = false;
      if (l === 'frame') op = 0.55;
    } else if (mode === 'mech'){
      if (l === 'shell' || l === 'front') op = 0.11;
      if (l === 'frame') op = 0.45;
    } else { /* front */
      if (l === 'shell') op = 0.05;
      if (l === 'frame') op = 0.05;
      if (l === 'mech') op = (m.userData.layerIndex === 4) ? 0.95 : 0.05;
    }
    m.visible = vis;
    m.material.transparent = op < 1;
    m.material.opacity = op;
    m.material.depthWrite = op > 0.6;
    m.material.needsUpdate = true;
  });
  grid.material.opacity = mode === 'front' ? 0.2 : 0.75;
  grid.material.transparent = true;
  applyPeel();
  const c = MODE_CAM[mode];
  camTarget = {theta:c.theta, phi:c.phi, dist:c.dist, ty:c.ty};
}

function applyPeel(){
  RIG.chest.forEach(h=>{
    h.userData.stack.forEach(m=>{
      const i = m.userData.layerIndex;
      const spread = (mode === 'front') ? peel * 0.085 : 0;
      m.position.z = m.userData.homeZ + spread * (4 - i);
    });
  });
}

/* --------------------------- CAMERA / ORBIT ----------------------------- */
const cam = {theta:0.52, phi:1.26, dist:4.2, ty:1.02};
let camTarget = {...cam};
function updateCamera(){
  const r = cam.dist, sp = Math.sin(cam.phi);
  camera.position.set(r*sp*Math.sin(cam.theta), cam.ty + r*Math.cos(cam.phi), r*sp*Math.cos(cam.theta));
  camera.lookAt(0, cam.ty, 0);
}
const drag = {on:false,x:0,y:0,btn:0};
renderer.domElement.addEventListener('pointerdown', e=>{
  drag.on=true; drag.x=e.clientX; drag.y=e.clientY; drag.btn=e.button;
  renderer.domElement.setPointerCapture(e.pointerId);
});
renderer.domElement.addEventListener('pointerup', e=>{
  drag.on=false; try{renderer.domElement.releasePointerCapture(e.pointerId);}catch(_){}
});
renderer.domElement.addEventListener('pointermove', e=>{
  if(!drag.on) return;
  const dx=e.clientX-drag.x, dy=e.clientY-drag.y;
  drag.x=e.clientX; drag.y=e.clientY;
  if(drag.btn===2||e.shiftKey){
    camTarget.ty = cam.ty = clamp(cam.ty + dy*0.004, 0.2, 2.0);
  } else {
    camTarget.theta = cam.theta -= dx*0.006;
    camTarget.phi   = cam.phi = clamp(cam.phi + dy*0.005, 0.25, Math.PI-0.15);
  }
  updateCamera();
});
renderer.domElement.addEventListener('wheel', e=>{
  e.preventDefault();
  camTarget.dist = cam.dist = clamp(cam.dist + e.deltaY*0.002, 0.9, 11);
  updateCamera();
}, {passive:false});
renderer.domElement.addEventListener('contextmenu', e=>e.preventDefault());

/* ---------------------------- TRANSPORT UI ------------------------------ */
const state = {t:0, playing:false, dir:1, speed:1, loop:true, env:false};
const DURATION = 11.0;   // seconds for a full cycle at 1x

const elPlay = document.getElementById('btn-play');
const elDir  = document.getElementById('btn-dir');
const elLoop = document.getElementById('btn-loop');
const elEnv  = document.getElementById('btn-env');
const elScrub= document.getElementById('scrub');
const elTcode= document.getElementById('tcode');
const elPhBar= document.getElementById('phasebar');

PHASES.forEach((p,i)=>{
  const d = document.createElement('div');
  d.className='pseg'; d.style.flex = (p.b-p.a);
  d.innerHTML = `<span>${String(i+1).padStart(2,'0')} ${p.name}</span>`;
  d.addEventListener('click', ()=>{ setT(p.a + 0.001); state.playing=false; syncUI(); });
  elPhBar.appendChild(d);
});
const segEls = [...elPhBar.children];

function phaseAt(t){
  for(let i=PHASES.length-1;i>=0;i--) if(t >= PHASES[i].a) return i;
  return 0;
}
function setT(v){ state.t = clamp(v,0,1); }

elPlay.addEventListener('click', ()=>{
  if(!state.playing){
    if(state.dir>0 && state.t>=0.999) setT(0);
    if(state.dir<0 && state.t<=0.001) setT(1);
  }
  state.playing=!state.playing; syncUI();
});
elDir.addEventListener('click', ()=>{ state.dir*=-1; syncUI(); });
elLoop.addEventListener('click', ()=>{ state.loop=!state.loop; syncUI(); });
elEnv.addEventListener('click', ()=>{ state.env=!state.env; syncUI(); });
document.querySelectorAll('[data-spd]').forEach(b=>{
  b.addEventListener('click', ()=>{
    state.speed=parseFloat(b.dataset.spd);
    document.querySelectorAll('[data-spd]').forEach(x=>x.classList.toggle('on', x===b));
  });
});
document.getElementById('btn-step-f').addEventListener('click', ()=>{
  const i = phaseAt(state.t);
  const nxt = PHASES[Math.min(i+1, PHASES.length-1)];
  setT(state.t >= nxt.a ? 1 : nxt.a + 0.001);
  state.playing=false; syncUI();
});
document.getElementById('btn-step-b').addEventListener('click', ()=>{
  const i = phaseAt(state.t);
  const cur = PHASES[i];
  setT(state.t > cur.a + 0.004 ? cur.a + 0.001 : (i>0 ? PHASES[i-1].a + 0.001 : 0));
  state.playing=false; syncUI();
});
elScrub.addEventListener('input', ()=>{ setT(elScrub.value/1000); state.playing=false; syncUI(); });

window.addEventListener('keydown', e=>{
  if(e.code==='Space'){ e.preventDefault(); elPlay.click(); }
  if(e.code==='ArrowRight'){ setT(state.t+0.01); state.playing=false; syncUI(); }
  if(e.code==='ArrowLeft'){ setT(state.t-0.01); state.playing=false; syncUI(); }
});

function syncUI(){
  elPlay.textContent = state.playing ? '❚❚ Pause' : '▶ Play';
  elPlay.classList.toggle('on', state.playing);
  elDir.textContent = state.dir>0 ? 'Opening' : 'Closing';
  elDir.classList.toggle('on', state.dir<0);
  elLoop.classList.toggle('on', state.loop);
  elEnv.classList.toggle('on', state.env);
}

/* ------------------------------ SIDEBAR --------------------------------- */
const bodyEl = document.getElementById('body');
document.querySelectorAll('.mode').forEach(el=>{
  el.addEventListener('click', ()=>{
    mode = el.dataset.mode;
    document.querySelectorAll('.mode').forEach(x=>x.classList.toggle('on', x===el));
    applyMode(); renderSide();
  });
});

function renderSide(){
  if(mode === 'front'){
    bodyEl.innerHTML = `
      <div class="kicker">Front Plate · Cross-section</div>
      <h2 class="title">How the coloured front is built</h2>
      <div class="sec"><p>The visible front is five layers, not one part. Drag the slider to pull them apart — the point is that the layer you paint and the layer that carries load are never the same piece.</p></div>
      <div class="sec">
        <div class="rlabel"><span>Assembled</span><span>Peeled</span></div>
        <input type="range" class="slim" id="peel" min="0" max="100" value="${Math.round(peel*100)}">
      </div>
      <div class="sec"><h3>Layers · front to back</h3>
        ${LAYERS.map((l,i)=>`<div class="layer" data-li="${i}">
          <span class="sw" style="background:${l.col}"></span>
          <span class="t">${l.nm}<em>${l.sub}</em></span>
          <span class="th">${l.th}</span></div>`).join('')}
      </div>
      <div class="sec" id="layer-note"><h3>Note</h3><p>${LAYERS[3].note}</p></div>
      <div class="sec"><h3>Parting line</h3><p>The split runs down the sternum, offset <code>5 mm</code> off centre so it falls on a shape change rather than across a flat panel — a seam on a curve reads as a design line, a seam on a flat face reads as a crack. The lamp bezel sits proud of the seam and bridges it visually when closed.</p></div>
      <div class="warn"><b>Paint order</b>Fit, hinge and latch the panel in bare material first. Confirm the gasket crushes evenly all the way round, then strip it down and paint. Painting first means sanding the paint off again at every shim.</div>`;
    const pk = document.getElementById('peel');
    pk.addEventListener('input', ()=>{ peel = pk.value/100; applyPeel(); });
    bodyEl.querySelectorAll('[data-li]').forEach(el=>{
      el.addEventListener('click', ()=>{
        document.getElementById('layer-note').innerHTML =
          `<h3>${LAYERS[el.dataset.li].nm}</h3><p>${LAYERS[el.dataset.li].note}</p>`;
      });
    });
    return;
  }

  if(mode === 'mech'){
    bodyEl.innerHTML = `
      <div class="kicker">Mechanism View</div>
      <h2 class="title">What drives the cycle</h2>
      <div class="sec"><p>The shell drops to 11% so you can watch the hardware. Play the sequence from here — the interesting part is the order, not any single actuator.</p></div>
      <div class="sec"><h3>Interlock order</h3><ul class="notes">
        <li><b>Latches before anything.</b> Six rotary latches, all reporting open, or the controller refuses the next step.</li>
        <li><b>Dorsal before chest.</b> The back plate is the keystone — the front halves physically cannot clear until it has travelled aft.</li>
        <li><b>Chest before pelvis.</b> Keeps the centre of mass predictable while the apron swings.</li>
        <li><b>Limbs last.</b> Lightest, non-structural, and the only ones safe to run in parallel.</li>
      </ul></div>
      <div class="sec"><h3>Live actuators</h3><div id="actlist"></div></div>
      <div class="sec"><h3>Closing is not a reverse</h3><p>Running the open sequence backwards gets the shell shut but not <em>sealed</em>. Closing ends with a separate capture step: the halves come together to within <code>2 mm</code>, pause, then the latches pull them the rest of the way, crushing the gasket evenly. Drive it shut with the rams alone and you pinch one edge first and leave a gap at the other.</p></div>
      <div class="warn"><b>Never close unattended</b>Closing is the dangerous direction. Hold-to-run control only — release the button and it stops. No one-press close, ever, on a mechanism that shuts around a person.</div>`;
    return;
  }

  bodyEl.innerHTML = `
    <div class="kicker">Shell View</div>
    <h2 class="title" id="ph-title">Standby</h2>
    <div class="sec"><p id="ph-desc">—</p></div>
    <div class="sec"><h3>Active this phase</h3><div id="actlist"></div></div>
    <div class="sec"><h3>Cycle</h3><table class="specs">
      <tr><td>Full open</td><td>11.0 s at 1×</td></tr>
      <tr><td>Full close + capture</td><td>13.5 s</td></tr>
      <tr><td>Peak draw</td><td>14.8 A (dorsal + chest)</td></tr>
      <tr><td>Energy per cycle</td><td>~3.1 Wh</td></tr>
      <tr><td>Entry opening</td><td>540 mm shoulder · 420 mm hip</td></tr>
      <tr><td>Hold at open</td><td>mechanical detent, 0 A</td></tr>
    </table></div>
    <div class="warn"><b>Manual egress</b>Every latch has a pull-cable release reachable from inside the frame. If the pack dies at full close, the wearer gets themselves out with no power and no help. Design this before you design anything else.</div>`;
}

/* ------------------------------- LOOP ----------------------------------- */
function resize(){
  const w = wrap.clientWidth, h = wrap.clientHeight;
  camera.aspect = w/h; camera.updateProjectionMatrix(); renderer.setSize(w,h);
}
window.addEventListener('resize', resize);

let last = performance.now(), perf = 0;
const v3 = new THREE.Vector3();

function tick(now){
  requestAnimationFrame(tick);
  const dt = Math.min((now-last)/1000, 0.05); last = now; perf += dt;

  if(state.playing){
    state.t += state.dir * dt * state.speed / DURATION;
    const wasDir = state.dir;
    if(state.t >= 1){ state.t = 1; state.loop ? (state.dir = -1) : (state.playing = false, syncUI()); }
    if(state.t <= 0){ state.t = 0; state.loop ? (state.dir = 1)  : (state.playing = false, syncUI()); }
    if(state.dir !== wasDir) syncUI();   // only on a turnaround, not every frame
  }

  applyPose(state.t);

  /* camera easing toward mode preset */
  cam.theta += (camTarget.theta-cam.theta)*0.07;
  cam.phi   += (camTarget.phi  -cam.phi  )*0.07;
  cam.dist  += (camTarget.dist -cam.dist )*0.07;
  cam.ty    += (camTarget.ty   -cam.ty   )*0.07;
  updateCamera();

  /* readouts */
  elScrub.value = Math.round(state.t*1000);
  elTcode.textContent = `T ${state.t.toFixed(3)} · ${(state.t*DURATION).toFixed(1)} s`;
  const pi = phaseAt(state.t), ph = PHASES[pi];
  document.getElementById('ph-num').textContent = String(pi+1).padStart(2,'0');
  document.getElementById('ph-name').textContent = ph.name.toUpperCase();
  document.getElementById('ph-dir').textContent =
    !state.playing ? '— HOLD —' : (state.dir>0 ? '▼ OPENING' : '▲ CLOSING');
  segEls.forEach((s,i)=>s.classList.toggle('on', i===pi));

  const tEl = document.getElementById('ph-title');
  if(tEl){ tEl.textContent = ph.name; document.getElementById('ph-desc').textContent = ph.desc; }

  const al = document.getElementById('actlist');
  if(al){
    const local = seg(state.t, ph.a, ph.b);
    const want = ph.act.map(a=>
      `<div class="act"><span class="bar"><i style="width:${Math.round(local*100)}%"></i></span>
       <span class="nm">${a[0]}</span><span class="val">${a[1]} · ${a[2]}</span></div>`).join('');
    if(al.dataset.key !== ph.id + Math.round(local*25)){
      al.dataset.key = ph.id + Math.round(local*25);
      al.innerHTML = want;
    }
  }

  /* 3D labels, mechanism view only */
  const showLabels = mode === 'mech';
  LABELS.forEach((L,i)=>{
    const el = labelEls[i];
    if(!showLabels){ el.style.opacity = 0; return; }
    v3.copy(L.p).project(camera);
    const x = (v3.x*0.5+0.5)*wrap.clientWidth, y = (-v3.y*0.5+0.5)*wrap.clientHeight;
    el.style.left = x+'px'; el.style.top = y+'px';
    el.style.opacity = (v3.z < 1) ? 0.9 : 0;
  });

  renderer.render(scene, camera);
}

resize(); applyMode(); updateCamera(); syncUI(); renderSide();
requestAnimationFrame(tick);
<\/script>
</body>
</html>
</script>
</div>

<script>
(function(){
  "use strict";

  var VIEWS = [{id:"parts",label:"Parts Reference",blurb:"Every joint, actuator and plate, with specs and build notes"},{id:"sequence",label:"Entry Sequence",blurb:"Scrub the don/doff cycle, mechanism and front-plate layers"}];
  var frames = {};

  function unescapeMarkup(text){
    // restore the closing tags escaped at build time
    return text.replace(/<\\\/script>/g, '<\/script>');
  }

  function mount(id){
    if (frames[id]) return frames[id];
    var tpl = document.getElementById('tpl-' + id);
    var frame = document.createElement('iframe');
    frame.className = 'view';
    frame.id = 'view-' + id;
    frame.setAttribute('title', id + ' view');
    document.getElementById('views').appendChild(frame);
    frame.srcdoc = unescapeMarkup(tpl.textContent);
    frames[id] = frame;
    return frame;
  }

  function show(id){
    var meta = VIEWS.filter(function(v){ return v.id === id; })[0];
    if (!meta) return;
    var loading = document.getElementById('loading');
    if (loading) loading.style.display = 'none';

    mount(id);
    Object.keys(frames).forEach(function(k){
      frames[k].classList.toggle('on', k === id);
    });
    document.querySelectorAll('.tab').forEach(function(t){
      t.classList.toggle('on', t.dataset.view === id);
    });
    document.getElementById('blurb').textContent = meta.blurb;

    try { history.replaceState(null, '', '#' + id); } catch(e) {}
    try { localStorage.setItem('exo1-view', id); } catch(e) {}
  }

  document.querySelectorAll('.tab').forEach(function(t){
    t.addEventListener('click', function(){ show(t.dataset.view); });
  });

  // number keys switch views
  window.addEventListener('keydown', function(e){
    var i = parseInt(e.key, 10);
    if (i >= 1 && i <= VIEWS.length && !e.metaKey && !e.ctrlKey) show(VIEWS[i-1].id);
  });

  var start = (location.hash || '').replace('#','');
  if (!VIEWS.some(function(v){ return v.id === start; })) {
    start = null;
    try { start = localStorage.getItem('exo1-view'); } catch(e) {}
  }
  if (!VIEWS.some(function(v){ return v.id === start; })) start = VIEWS[0].id;
  show(start);
})();
</script>
</body>
